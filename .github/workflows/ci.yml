name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build Charites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go (QUAL-00-REPRO-001 Deterministic Pin)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'
          cache: true

      - name: Verify Module Dependencies (QUAL-00-DEPS-001)
        run: go mod verify

      - name: Verify Zero CGO Surface (QUAL-00-INVAR-001)
        run: |
          cgo_files=$(go list -f '{{range .CgoFiles}}{{.}} {{end}}' ./...)
          if [ -n "$cgo_files" ]; then
            echo "Error: CGO files detected: $cgo_files"
            exit 1
          fi

      - name: Install golangci-lint (QUAL-00-LINT-001 Pinned v1.64.8)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Build, Test, and Lint (ARCH-00-BUILD-ORDER / TEST-00-BUILD-ORDER)
        run: make all

      - name: Verify Cross-Platform Compilation Targets (SPEC-00-BUILD-002 / TEST-00-BUILD-002)
        run: make cross-compile
