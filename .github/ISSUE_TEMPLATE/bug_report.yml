name: Bug Report / False Positive
description: File a bug report, false positive diagnostic, or unexpected analyzer failure
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **Charites**!
        Please provide reproducible template code so we can diagnose and resolve the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "CLI Scanner (`charites scan` / `check`)"
        - "Leaf IR Parser (Astro / HTML)"
        - "Leaf IR Parser (TSX / JSX)"
        - "CSS / Tailwind Tokenizer"
        - "Theme Rules (`theme.*`)"
        - "Accessibility Rules (`a11y.*`)"
        - "Responsive Rules (`responsive.*`)"
        - "Performance Rules (`perf.*`)"
        - "Tailwind Rules (`tailwind.*`)"
        - "MCP Server (`charites mcp`)"
        - "Reporters (Inline / JSON / Markdown)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux (x86_64 / amd64)"
        - "Linux (arm64 / aarch64)"
        - "macOS (Apple Silicon)"
        - "Windows (x86_64)"
    validations:
      required: true

  - type: input
    id: charites_version
    attributes:
      label: Charites Version
      description: Run `charites --version` and paste the output.
      placeholder: "charites v1.0.0 (commit abc1234, date 2026-09-05)"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Code Example
      description: Provide a minimal code snippet (.astro, .tsx, or .css) that triggers the bug or false positive.
      render: html
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect Charites to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What did Charites actually output (e.g. error message, unexpected diagnostic, panic trace)?
    validations:
      required: true
