name: Feature Request
description: Suggest an enhancement or new capability for the Charites compiler, CLI, or MCP server
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Charites faster, support additional web template frameworks, or better integrated into developer workflows?
        Let us know below!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: A clear and concise description of what the problem or limitation is (e.g. "Currently, parsing .mdx files is unsupported...").
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like Charites to do, including proposed CLI flags, configuration keys, parser extensions, or reporting formats.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, benchmarks, or web standard specifications here.
    validations:
      required: false
