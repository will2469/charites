# ==============================================================================
# Charites Static Analysis Configuration Example (charites.yaml)
# Principle: Default: YES (all rules active by default)
# Use this file strictly to configure overrides.
# ==============================================================================

# General settings
format: inline # inline | json
scan_path: .

# Custom theme SSOT path (optional)
# Auto-discovered by default from: styles/global.css, src/styles/global.css, tokens.json.
# Specify here if your design tokens live in a non-standard location or custom folder.
# theme: src/styles/global.css

# Custom ignore patterns (in addition to .charitesignore)
ignore:
  - "legacy/**"
  - "test-fixtures/**"

# Rule severity overrides: off | warn | error | info
rules:
  theme.hardcode-opacity-color: error
  theme.hardcode-color: warn

# Token naming convention & semantic inference (optional, design-agnostic)
# Allows your team/design system to define custom opacity mappings, aliases, and property prefixes.
# convention:
#   prefixes:
#     - "--color-"
#     - "--"
#   opacity_mappings:
#     "10": ["-light", "-soft"]
#     "20": ["-light"]
#     "5": ["-subtle"]
#     "8": ["-subtle"]
#   fallbacks:
#     secondary: ["muted"]
